[nosetests]
verbosity = 2
with-coverage = 1
cover-erase = 1
cover-package = src
cover-inclusive = 1

[coverage:run]
branch = True
source = src

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 70

[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv

[pylint.main]
max-line-length = 88
ignore = .git,__pycache__,build,dist,.venv,venv

[pylint.messages_control]
disable =
    C0114,
    C0115,
    C0116

[pylint.format]
max-line-length = 88
